name: Build EP009 Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'EP009_jev-mid-frequency-benchmark/**'
      - '.github/workflows/build-ep009.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./EP009_jev-mid-frequency-benchmark
          file: ./EP009_jev-mid-frequency-benchmark/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:ep009-jev-mid-frequency-benchmark-latest
